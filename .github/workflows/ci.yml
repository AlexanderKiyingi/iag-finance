name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iag
          POSTGRES_PASSWORD: iag_dev
          POSTGRES_DB: iag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iag -d iag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Create finance schema
        env:
          PGPASSWORD: iag_dev
        run: psql -h localhost -U iag -d iag_platform -c 'CREATE SCHEMA IF NOT EXISTS finance;'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Use vendored platform-go
        run: go mod edit -replace=github.com/alvor-technologies/iag-platform-go=$(pwd)/third_party/platform-go

      - name: Build
        run: go build -v ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=finance
          ENVIRONMENT: staging
          AUDIENCE: iag.finance

      - name: Test
        run: go test ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=finance
          ENVIRONMENT: staging
          AUDIENCE: iag.finance

  docker:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iag
          POSTGRES_PASSWORD: iag_dev
          POSTGRES_DB: iag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iag -d iag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build production image (standalone target)
        run: docker build --target standalone -t iag-finance:ci .

      # The image is only proven if the server inside it boots, migrates and
      # answers /ready. The previous step ran `wget` *as* the container command
      # in place of the server, so nothing listened and it exited 4 every time —
      # masked for weeks by the test job failing ahead of it.
      - name: Boot the image against Postgres and hit /ready
        run: |
          docker run -d --name finance --network host \
            -e PORT=3006 -e ENVIRONMENT=staging -e AUDIENCE=iag.finance -e AUTO_MIGRATE=true -e ENABLE_CONSUMER=false \
            -e DATABASE_URL='postgres://iag:iag_dev@127.0.0.1:5432/iag_platform?sslmode=disable&search_path=finance' \
            iag-finance:ci
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:3006/ready 2>/dev/null); then
              echo "$body"
              echo "$body" | grep -q '"current":true' || { echo "schema not current after boot"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          echo "finance did not answer /ready within 60s"; docker logs finance; exit 1

      - name: Container logs
        if: always()
        run: docker logs finance 2>&1 | tail -50 || true
